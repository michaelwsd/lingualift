name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */4 * *' # Every 4 days
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          curl -fsS "${SUPABASE_URL}/auth/v1/health"
