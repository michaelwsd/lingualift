name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */4 * *' # Every 4 days
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
